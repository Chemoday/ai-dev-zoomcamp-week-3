apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-relay
  namespace: agent-relay
data:
  RELAY_LEASE_SECONDS: "60"
  RELAY_MAX_ATTEMPTS: "5"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-relay
  namespace: agent-relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-relay
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: agent-relay
    spec:
      # The app creates its schema at import time and exits if PostgreSQL is
      # unreachable; wait here instead of crash-looping.
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do sleep 2; done"]
      containers:
        - name: api
          # Loaded into the cluster with `kind load docker-image`; never pulled.
          image: agent-relay:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: agent-relay
          env:
            - name: RELAY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: RELAY_DATABASE_URL
          ports:
            - name: http
              containerPort: 8000
          # /ready checks the tables exist: no traffic until PostgreSQL is usable.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-relay
  namespace: agent-relay
spec:
  selector:
    app: agent-relay
  ports:
    - name: http
      port: 80
      targetPort: http
